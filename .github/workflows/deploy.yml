name: Publish Personal OS 6.7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run smoke tests
        run: npm run test:smoke
      - name: Workspace tests
        run: npm run test:workspace
      - name: Unified tasks and goals tests
        run: npm run test:unified
      - name: MVP regression tests
        run: npm run test:mvp
      - name: Motion regression
        run: npm run test:motion
      - name: 6.7 regression
        run: npm run test:v67
      - name: Compile and build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
