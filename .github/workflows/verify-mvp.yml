name: Verify MVP changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Smoke tests
        run: npm run test:smoke
      - name: Workspace tests
        run: npm run test:workspace
      - name: Unified tests
        run: npm run test:unified
      - name: MVP tests
        run: npm run test:mvp
      - name: Motion regression
        run: npm run test:motion
      - name: 6.7 regression
        run: npm run test:v67
      - name: 6.8 foundations
        run: npm run test:v68
      - name: 6.8 action flow
        run: npm run test:action-flow
      - name: 6.8 Pipeline
        run: npm run test:pipeline-motion
      - name: 6.8 Navigation
        run: npm run test:shell
      - name: 6.8 Goals
        run: npm run test:goals-compat
      - name: 6.9 Goals Workspace
        run: npm run test:goals-workspace
      - name: 6.9.1 goal and Buffer regressions
        run: npm run test:goals-691
      - name: 6.8 Integration
        run: npm run test:integration
      - name: Unified task properties contract
        run: node tests/unified-task-properties.mjs
      - name: Task polish contracts
        run: node tests/task-polish.mjs
      - name: Typecheck and build
        run: npm run build
